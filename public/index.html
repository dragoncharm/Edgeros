<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project-base_render</title>
  <link rel="stylesheet" href="./css/index.css">
</head>

<body>
  <div id="toast"></div>
  <div class="page">
    <h3>在线设备</h3>
    <div class="page-content">
      <!-- 设备列表 -->
      <div id="list" onclick="clickListDom(event)"></div>
      <!-- 抽屉遮罩 -->
      <div class="drawer-cover" id="drawerCover"></div>
      <!-- 抽屉 -->
      <div class="drawer" id="drawer">
        <h4 id="drawerTitle"></h4>
        <div id="color_choice" style="display: none;">
          <h5>颜色</h5>
          <div id="colorPicker" class="color-picker" onclick="clickColorPicker(event)"></div>
          <h5>亮度</h5>
          <input type="range" id="brightSlider" class="bright-slider" name="slider" min="0" max="100" value="50"
            onchange="onBrightnessChange(event)">
        </div>

        <!-- 开关 -->
        <div  id="switch_div" style="display:none">
          <h5>开关</h5>
          <div class="power">
            <div id="powerBtn" class="power-btn" onclick="switchPower()"></div>
          </div>
        </div>

        <!-- //环境传感器 -->
        <div id="sensor_div" style="display:none">
          <h5>环境信息</h5>
          <span id="pm" style="display:block;margin:0 auto"></span>
          <span id="temp" style="display:block;margin:0 auto"></span>
          <span id="humi" style="display:block;margin:0 auto"></span>
          <button onclick="clickSensorPicker(event)">刷新</button>
        </div>

        <!-- 窗帘电机 -->
         <div id = "curtains_div" style="display: none">
          <h5>窗帘设置</h5>
          <button onclick = "clickCurtainsToOpen()">打开窗帘</button>
          <button onclick = "clickCurtainsToClose()">关闭窗帘</button>
          <button onclick = "clickCurtainsToStop()">停止</button>
         </div>

         <!-- 燃气报警装置 -->
          <div id = "sensorCh4_div" style="display: none">
            <h5>浓度状态</h5>  
            <p id = "state_ch4" style="display: block; margin: 0 auto"></p>
            <h5>浓度</h5>
            <p id = "lel" style="display: block; margin: 0 auto"></p>
          </div>
      </div>


    </div>
  </div>
  </div>
  </div>
</body>

<script src="./libs/axios.min.js"></script>
<script src="./libs/socket.js"></script>
<script src="./libs/sdk.min.js"></script>
<script>

  // 创建一个模拟的设备列表数据
  const deviceStore = {
    "light.belt": [],
    "sensor.pm2.5": [],
    "sensor.ch4": [],
    "curtains": [],
    "plug": []
  }

  // 创建一个模拟的设备列表数据
  let deviceList = []

  let selectedDevice = {}//表示被选中的设备

  let light_rtv = {
    state: 'off',
    bright: 0,
    color: [255, 255, 255]
  }

  let plug_rtv = {
    state: 'on',
    initial: 'off'
  }

  let sensor_rtv = {
    "pm": 0,
    "temp": 0,
    "humi": 0
  }

  let sensorCh4_rtv = {
    state: 'initial',
    value: 0
  }

  let curtain_rtv = {
    action: 'init'
  }

  const listDom = document.getElementById('list')

  const COLORS = [[255, 0, 0], [255, 165, 0], [255, 255, 0], [0, 128, 0], [0, 255, 255], [0, 0, 255], [128, 0, 128], [255, 255, 255]]
  const colorPicker = document.getElementById('colorPicker')

  const brightSliderDom = document.getElementById('brightSlider')

  const powerBtnDom = document.getElementById('powerBtn')

  init().catch(console.error)

  // 页面初始化
  async function init() {
    initRenderColorPicker()
    await initEdgerToken()
    initSocket()
    //deviceList = await getDeviceList()

    deviceStore['light.belt'] = await getDeviceList('lightbelt')
    deviceStore['sensor.pm2.5'] = await getDeviceList('env')
    deviceStore['sensor.ch4'] = await getDeviceList('gas')
    deviceStore['curtains'] = await getDeviceList('curtains')
    deviceStore['plug'] = await getDeviceList('plug')
    renderDeviceList(deviceStore['light.belt'])
    renderDeviceList(deviceStore['sensor.pm2.5'])
    renderDeviceList(deviceStore['sensor.ch4'])
    renderDeviceList(deviceStore['curtains'])
    renderDeviceList(deviceStore['plug'])
  
    initPermission()
  }

  // 初始化应用设备权限
  function initPermission(devid) {
    let devids = []
    if (devid) {
      devids = [devid]
    } else {
      devids = deviceList.map(item => item.devid)
    }
    edger.permission.request({
      code: devids,
      type: 'devices'
    })
  }


  let edgerToken = '' // 爱智Token
  let edgerSrand = '' // 爱智随机数
  function initEdgerToken() {
    edger.onAction('token', (data) => {
      console.log('token changed:', data)
      if (data && data.token) {
        edgerToken = data.token
      }
      if (data && data.srand) {
        edgerSrand = data.srand
      }
    })

    return new Promise((resolve, reject) => {
      edger
        .token()
        .then((data) => {
          console.log('token:', data)
          if (data && data.token) {
            edgerToken = data.token
          }
          if (data && data.srand) {
            edgerSrand = data.srand
          }
          if (edgerToken && edgerSrand) {
            resolve(true)
          } else {
            reject(false)
          }
        })
        .catch((error) => {
          reject(error)
        })
    })

  }

  // 查询设备列表
  async function getDeviceList(devpath) {
    const res = await axios.get(`/api/device/${devpath}`, {
      headers: { // 未开启非安全模式，请求头需添加下面俩个参数
        'edger-token': edgerToken,
        'edger-srand': edgerSrand
      }
    })
    if (res.status === 200) {
      const respData = res.data
      if (respData.code === 1) {
        return respData.data
      } else {
        throw new Error(respData.msg)
      }
    } else {
      throw new Error(res.status)
    }
  }


  
  // 渲染列表内容
  function renderDeviceList(devList) {
    // 渲染内容是往list元素下追加节点，所以需要先清空之前的数据，否则会重复渲染
    clearListRender(devList[0].type)
    if (devList.length) {
    // for循环遍历追加子节点
      for (let index = 0; index < devList.length; index++) {
        const dev = devList[index]
        // 创建一个div的标签元素
        const dom = document.createElement('div')
        // 给div设置显示的文本
        dom.innerText = `${dev.label}_${dev.devid}`
        // 给div设置类名，类的css样式提前写好
        dom.className = 'list-item',
        // 给div元素标记缓存设备信息
        dom.dataset.devid = dev.devid
        dom.dataset.devlabel = dev.label
        dom.dataset.devtype = dev.type
        dom.dataset.devbrand = dev.brand
        dom.dataset.devmodel = dev.model
        // 将构建好的div元素追加到list元素下面，在页面中就会显示出来了
        listDom.appendChild(dom)
      }
    } else {
      const dom = document.createElement('div')
      dom.innerText = '未发现氛围灯设备'
      dom.style.textAlign = 'center'
      dom.style.color = '#ccc'
      dom.style.marginTop = '48px'
      listDom.appendChild(dom)
    }
  }

  // 清空list元素下的内容

// 清空指定类型设备的list元素下的内容
  function clearListRender(type) {
    // 首先获取所有list-item元素
    const items = listDom.querySelectorAll('.list-item');
    // 遍历每个item，移除指定类型的设备
    items.forEach(item => {
      if (item.dataset.devtype === type) { // 检查设备类型
      listDom.removeChild(item);
      }
    });
  }

  function clickListDom(e) {
    const target = e.target;    
    console.log("Clicked element:", target); // 输出被点击的元素
    if (target.classList.contains('list-item')) {
      const devid = target.dataset.devid;
      const type = target.dataset.devtype; // 假设每个设备条目都有一个数据属性指定其类型
      // 通过设备类型获取正确的列表并查找设备
      const dev = deviceStore[type]?.find(item => {
        console.log("Checking device:", item.devid, "against clicked devid:", devid);
        return item.devid === devid;
      });
      if (dev) {
        console.log("Device found:", dev); // 输出找到的设备对象
        selectedDevice = dev;
        renderDrawer(selectedDevice);
      } else {
        console.error('Device not found for DEVID:', devid);
        // 添加错误处理逻辑
      }
    }

  }

  
  const drawerDom = document.getElementById('drawer')//
  const drawerTitleDom = document.getElementById('drawerTitle')

  const drawerCoverDom = document.getElementById('drawerCover')
  drawerCoverDom.addEventListener('click', hiddenDrawer)

  // 显示抽屉
  function renderDrawer(dev) {
    drawerTitleDom.innerText = dev.label
    drawerDom.classList.add('drawer--show')
    drawerCoverDom.classList.add('drawer-cover--show')
    switch (dev.type) {
      case "light.belt":
        document.getElementById("color_choice").style.display = "block"
        document.getElementById("switch_div").style.display = "block"
        //同步该设备最新数据
        control(dev.devid, {
          method: 'get',
          data: ["state", "bright", "color"]
        }).catch(console.error)
        break;
      case "plug":
        document.getElementById("switch_div").style.display = "block"
        //同步该设备最新数据
        control(dev.devid, {
          method: 'get',
          data: ["state"]
        }).catch(console.error)
        break;
      case "sensor.pm2.5":
        document.getElementById("sensor_div").style.display = "block"
        //同步该设备最新数据
        control(dev.devid, {
          method: "get",
          data: ["PM2.5", "temp", "humi"]
        }).catch(console.error)
        break;
      case "curtains":
        document.getElementById("curtains_div").style.display = "block"
        break;
      case "sensor.ch4":
        document.getElementById("sensorCh4_div").style.display = "block"
        //同步该设备最新数据
        control(dev.devid, {
          method: 'get',
          data: ["state", "value"]
        }).catch(console.error)
        break;
      default:
    }

  }

  // 隐藏抽屉
  function hiddenDrawer() {
    drawerDom.classList.remove('drawer--show')
    drawerCoverDom.classList.remove('drawer-cover--show')
    document.getElementById("color_choice").style.display = 'none'
    document.getElementById("switch_div").style.display = "none"
    document.getElementById("sensor_div").style.display = "none"
    document.getElementById("curtains_div").style.display = "none"
    document.getElementById("sensorCh4_div").style.display = "none"
  }

  // 初始化颜色面板渲染
  function initRenderColorPicker() {
    COLORS.forEach(item => {
      const div = document.createElement('div')
      div.className = 'color-picker_item'
      div.dataset.color = JSON.stringify(item)
      div.style.backgroundColor = `RGB(${item[0]}, ${item[1]}, ${item[2]})`
      colorPicker.appendChild(div)
    })
  }

  let toastDelayTimer
  const toast = document.getElementById('toast')
  function showToast(msg) {
    toast.innerHTML = msg
    toast.style.display = 'block'
    clearTimeout(toastDelayTimer)
    toastDelayTimer = setTimeout(() => {
      toast.style.display = 'none'
    }, 2000)
  }

  // 点击切换氛围灯颜色
  function clickColorPicker(e) {
    const target = e.target
    if (target.classList.contains('color-picker_item')) {
      // 是子元素
      const targetColor = JSON.parse(target.dataset.color)
      const data = {
        method: "set",
        data: {
          color: targetColor
        }
      }
      control(selectedDevice.devid, data).catch(console.warn)
    }
  }

  // 拖拽亮度滑动条控制亮度
  function onBrightnessChange(event) {
    control(selectedDevice.devid, {
      method: 'set',
      data: {
        bright: Number(event.target.value)
      }
    })
  }

  // 开关氛围灯
  function switchPower() {
    const state = light_rtv.state === 'on' ? 'off' : 'on'
    control(selectedDevice.devid, {
      method: 'set',
      data: {
        state
      }
    })
  }

  //开窗帘
  function clickCurtainsToOpen(){
    control(selectedDevice.devid, {
      "method": "set",
      "data":{
        "action": "open",
        //"position" : 0
        // "speed": "low"
      }
    })
  }

  //关窗帘
  function clickCurtainsToClose(){
    control(selectedDevice.devid, {
      "method": "set",
      "data":{
        "action": "close",
        //"position": 100
        // "speed": "low"
      }
    })
  }

  //关窗帘
  function clickCurtainsToStop(){
    control(selectedDevice.devid, {
      "method": "set",
      "data":{
        "action": "stop",
        //"position": 100
        // "speed": "low"
      }
    })
  }

  // 发送控制设备请求
  async function control(devid, data) {
    const res = await axios.post('/api/device/control', {
      devid,
      data
    }, {
      headers: { // 未开启非安全模式，请求头需添加下面俩个参数
        'edger-token': edgerToken,
        'edger-srand': edgerSrand
      }
    })
    if (res.status === 200) {
      if (res.data.code === 2) {
        // 无权限
        showToast('无权限，请到设置中开启权限后重试')
      }
    } else {
      throw new Error(res.status)
    }
  }

  // 更新颜色面板渲染
  let colorPickerIdx = -1
  function updateColorPickerRender(color) {
    const idx = COLORS.findIndex(item => item[0] === color[0] && item[1] === color[1] && item[2] === color[2])
    if (idx >= 0) {
      if (idx !== colorPickerIdx) {
        colorPicker.childNodes[colorPickerIdx]?.classList.remove('color-picker_item--selected')
        colorPicker.childNodes[idx].classList.add('color-picker_item--selected')
        colorPickerIdx = idx
      }
    }
  }

  // 更新亮度滑动条渲染
  function updateBrightSliderRender(bright) {
    brightSliderDom.value = bright
  }

  // 更新开关状态渲染
  function updatePowerRender(state) {
    if (state === 'on') {
      powerBtnDom.classList.add('power-btn_on')
    } else {
      powerBtnDom.classList.remove('power-btn_on')
    }
  }

  //刷新环境传感器
  function clickSensorPicker(e) {
    //const target = e.target
    const data = {
      "method": "get",
      "data": ["PM2.5", "temp", "humi"]
    }
    control(selectedDevice.devid, data)

    document.getElementById("pm").innerHTML = "PM2.5:" + sensor_rtv["PM2.5"];
    document.getElementById("temp").innerHTML = "temp:" + sensor_rtv.temp;
    document.getElementById("humi").innerHTML = "humi:" + sensor_rtv.humi;
  }

  //获取燃气设备状态
  setInterval(function(){
    const data = {
      "method": "get",
      "data": ["state", "value"]
    }
    document.getElementById("state_ch4").innerHTML = sensorCh4_rtv.state;
    document.getElementById("lel").innerHTML = sensorCh4_rtv.value;

  }, 50);

  function initSocket() {
    const socketClient = io({
      query: {
        'edger-token': edgerToken,
        'edger-srand': edgerSrand
      },
      transports: ['websocket']
    })
    socketClient.on('connect', () => {
      console.info('连接上后端socket服务了！！！')
    })
    //监听灯带上线和离线
    socketClient.on('lightbelt-join', async (devid) => {
      deviceStore['light.belt'] = await getDeviceList('lightbelt')
      renderDeviceList(deviceStore['light.belt'])
      initPermission(devid)
    })
    socketClient.on('lightbelt-lost', async (devid) => {
      deviceStore['light.belt'] = await getDeviceList('lightbelt')
      renderDeviceList(deviceStore['light.belt'])
    })
    //监听环境传感器上线和离线
    socketClient.on('env-join', async (devid) => {
      deviceStore['sensor.pm2.5'] = await getDeviceList('env')
      renderDeviceList(deviceStore['sensor.pm2.5'])
    })
    socketClient.on('env-lost', async (devid) => {
      deviceStore['sensor.pm2.5'] = await getDeviceList('env')
      renderDeviceList(deviceStore['sensor.pm2.5'])
    })
    //监听燃气传感器上线和离线
    socketClient.on('gas-join', async (devid) => {
      deviceStore['sensor.ch4'] = await getDeviceList('gas')
      renderDeviceList(deviceStore['sensor.ch4'])
    })
    socketClient.on('gas-lost', async (devid) => {
      deviceStore['sensor.ch4'] = await getDeviceList('gas')
      renderDeviceList(deviceStore['sensor.ch4'])
    })
    //监听窗帘电机上线和离线
    socketClient.on('curtains-join', async (devid) => {
      deviceStore['curtains'] = await getDeviceList('curtains')
      renderDeviceList(deviceStore['curtains'])
    })
    socketClient.on('curtains-lost', async (devid) => {
      deviceStore['curtains'] = await getDeviceList('curtains')
      renderDeviceList(deviceStore['curtains'])
    })
    //监听智能插座上线和离线
    socketClient.on('plug-join', async (devid) => {
      deviceStore['plug'] = await getDeviceList('plug')
      renderDeviceList(deviceStore['plug'])
    })
    socketClient.on('plug-lost', async (devid) => {
      deviceStore['plug'] = await getDeviceList('plug')
      renderDeviceList(deviceStore['plug'])
    })

    // 下面是监听设备实时值

    //监听灯的实时值
    socketClient.on('lightbelt-rtv', (params) => {
      if (selectedDevice && selectedDevice.devid === params.devid) {
        light_rtv = { ...light_rtv, ...params.data }
        console.log('lightbelt-rtv: ', light_rtv)
        // 更新渲染
        if (params.data.state !== undefined) {
          updatePowerRender(params.data.state)
        }
        if (params.data.bright !== undefined) {
          updateBrightSliderRender(params.data.bright)
        }
        if (params.data.color !== undefined) {
          updateColorPickerRender(params.data.color)
        }

        
      }
      
    })

    //监听开关的实时值
    socketClient.on('Plug-rtv',(params) =>{
      if (selectedDevice && selectedDevice.devid === params.devid) {
        plug_rtv = { ...plug_rtv, ...params.data }
        console.log('Plug-rtv: ', plug_rtv)
        // 更新渲染
        if (params.data.state !== undefined) {
          updatePowerRender(params.data.state)
        }
      }
    })

    //监听窗帘的实时值
    socketClient.on('curtains-rtv',(params) =>{
      if (selectedDevice && selectedDevice.devid === params.devid) {
        curtain_rtv = { ...curtain_rtv, ...params.data }
        console.log('curtains-rtv: ', curtain_rtv)
        
      }
    })

    //监听环境传感器的实时值
    socketClient.on('env-rtv',(params) =>{
      if (selectedDevice && selectedDevice.devid === params.devid) {
        sensor_rtv = { ...sensor_rtv, ...params.data }
        console.log('env-rtv: ', sensor_rtv)
        // // 更新渲染
       
      }
    })

    //监听燃气传感器的实时值
    socketClient.on('gas-rtv',(params) =>{
      if (selectedDevice && selectedDevice.devid === params.devid) {
        sensorCh4_rtv = { ...sensorCh4_rtv, ...params.data }
        console.log('gas-rtv: ', sensorCh4_rtv)
        // 更新渲染
        if (sensorCh4_rtv.state === 'alarm') {
          // console.log("看看我执行了没有")
          console.log(deviceStore)
          control(deviceStore['light.belt'][0].devid, {
                  method: 'set',
                  data: {
                    state: 'on',
                    start: 0,
                    end: 255,
                    bright: 100,
                    color: [255, 0, 0]                    
                    }
                  }
          ).catch(console.warn)
        }
        else{
          control(deviceStore['light.belt'][0].devid, {
            method: 'set',
            data: {
              state: 'off'
            }
          })
        }
        
      }
      }
    )


  }


</script>

</html>
